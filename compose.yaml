services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_DATA_DIR: /app/data
      NUXT_ENCRYPTION_KEY: ${NUXT_ENCRYPTION_KEY:?Set NUXT_ENCRYPTION_KEY}
      NUXT_SPOTIFY_CLIENT_ID: ${NUXT_SPOTIFY_CLIENT_ID:-}
      NUXT_SPOTIFY_REDIRECT_URI: ${NUXT_SPOTIFY_REDIRECT_URI:-}
      NUXT_ALLOWED_SPOTIFY_USERS: ${NUXT_ALLOWED_SPOTIFY_USERS:-}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
